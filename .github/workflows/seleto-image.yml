name: Seleto (imagem)

# Imagem do fork da Seleto: a versão oficial do AstraCalls + as alterações que
# ainda não entraram no projeto original (ver SELETO.md).
#
# Sai só para linux/amd64 (a arquitetura do nosso servidor) e vai para o GHCR:
#   ghcr.io/opsseletotiago/astracalls:<tag>
#
# Dispara com uma tag "seleto-*" (ex.: seleto-v1.1.7-1). O prefixo evita os
# workflows do projeto original, que respondem a tags "v*" e publicam no
# Docker Hub dele.

on:
  push:
    tags: ["seleto-*"]
  workflow_dispatch:

concurrency:
  group: seleto-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/opsseletotiago/astracalls

jobs:
  test:
    name: testes do servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  image:
    name: imagem linux/amd64
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (com submodulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: |
            BUILD_REV=${{ github.sha }}
            BUILD_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=seleto-amd64
          cache-to: type=gha,mode=max,scope=seleto-amd64

      - name: Confere a imagem publicada
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.ref_name }}
